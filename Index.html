<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>
                My Favorite Games:
            </h1>
            <!-- image of the game -->
            <img id = "images" src="fallguys.jpg" />
            

            <!--Name of the game  -->
            <h2 id = "name">
                FALL GUYS
                
            </h2>

            <!-- Text that talks a little about what the game is -->
            <p id = "ex" >
                In <b>FALL GUYS</b>, players can choose between making a Race or Survival rounds.<br> 
                There is a budget that limits the amount of objects a round can contain. <br>
                Players can submit their rounds & can share their rounds to others via share codes.
            </p>


            <!-- button that says Play now -->
            <button  onclick="playnow()" id = "pn">
                PLAY NOW
            </button>

            <!-- button that says Next game -->
            <button onclick="nextgame()" id = "ng">
                NEXT GAME
            </button>

         </main>

            </p>
         </footer>


        <script src="sketch.js"></script>
